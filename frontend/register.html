<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - AEGIS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">

    <div class="nav-container">

        <a href="index.html" class="logo">
            🛡️ AEGIS
        </a>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</nav>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                🛡️
            </div>

            <h1>
                Create AEGIS Account
            </h1>

            <p>
                Join the smart campus cybersecurity
                platform.
            </p>

        </div>


        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                    autocomplete="name">

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email">

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                    minlength="6"
                    autocomplete="new-password">

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    required
                    minlength="6"
                    autocomplete="new-password">

            </div>


            <button
                type="submit"
                id="registerButton"
                class="btn btn-primary btn-full">

                Create Account

            </button>

        </form>


        <div
            id="message"
            class="message"
            style="display:none;">
        </div>


        <div class="auth-footer">

            <p>

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </div>

</main>


<footer class="footer">

    <div class="container">

        <p>
            🛡️ AEGIS — AI-Powered Smart Campus
            Cybersecurity System
        </p>

        <p>
            Cybersecurity awareness and threat
            detection platform
        </p>

    </div>

</footer>


<script>

const API_URL =
    "https://aegis-4lcw.onrender.com";


document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;

            const button =
                document
                    .getElementById(
                        "registerButton"
                    );


            if (!name) {

                showMessage(
                    "Please enter your name.",
                    "error"
                );

                return;
            }


            if (!email) {

                showMessage(
                    "Please enter your email.",
                    "error"
                );

                return;
            }


            if (password.length < 6) {

                showMessage(
                    "Password must contain at least 6 characters.",
                    "error"
                );

                return;
            }


            if (password !== confirmPassword) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            button.disabled = true;

            button.textContent =
                "Creating Account...";


            try {

                const response =
                    await fetch(
                        API_URL + "/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                name: name,
                                email: email,
                                password: password
                            })
                        }
                    );


                let data = {};

                try {

                    data =
                        await response.json();

                } catch {

                    data = {};

                }


                if (!response.ok) {

                    let errorMessage =
                        "Registration failed.";

                    if (data.detail) {

                        if (
                            Array.isArray(
                                data.detail
                            )
                        ) {

                            errorMessage =
                                data.detail
                                    .map(
                                        item =>
                                            item.msg
                                    )
                                    .join(", ");

                        } else {

                            errorMessage =
                                data.detail;

                        }

                    }

                    throw new Error(
                        errorMessage
                    );
                }


                showMessage(
                    "Account created successfully! Redirecting to login...",
                    "success"
                );


                document
                    .getElementById(
                        "registerForm"
                    )
                    .reset();


                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    1500
                );


            } catch (error) {

                console.error(
                    "Registration error:",
                    error
                );


                if (
                    error instanceof
                    TypeError
                ) {

                    showMessage(
                        "Unable to connect to AEGIS server. Please try again after a few seconds.",
                        "error"
                    );

                } else {

                    showMessage(
                        error.message ||
                        "Registration failed.",
                        "error"
                    );

                }

            } finally {

                button.disabled = false;

                button.textContent =
                    "Create Account";

            }

        }
    );


function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;


    message.style.display =
        "block";


    message.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });

}

</script>

</body>

</html>
