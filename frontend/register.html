<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - AEGIS</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="nav-container">

        <a
            href="index.html"
            class="logo">

            🛡️ AEGIS

        </a>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</nav>



<!-- ================= REGISTER ================= -->

<main class="auth-page">

    <div class="auth-card">


        <!-- HEADER -->

        <div class="auth-header">

            <div class="auth-icon">
                🛡️
            </div>

            <h1>
                Create AEGIS Account
            </h1>

            <p>
                Join the smart campus cybersecurity
                platform.
            </p>

        </div>



        <!-- FORM -->

        <form id="registerForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                    autocomplete="name">

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email">

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                    minlength="6"
                    autocomplete="new-password">

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    required
                    minlength="6"
                    autocomplete="new-password">

            </div>



            <!-- BUTTON -->

            <button
                type="submit"
                id="registerButton"
                class="btn btn-primary btn-full">

                Create Account

            </button>


        </form>



        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
            style="display:none;">

        </div>



        <!-- LOGIN LINK -->

        <div class="auth-footer">

            <p>

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>


    </div>

</main>



<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div class="container">

        <p>
            🛡️ AEGIS — AI-Powered Smart Campus
            Cybersecurity System
        </p>

        <p>
            Cybersecurity awareness and threat
            detection platform
        </p>

    </div>

</footer>



<script>


/* =========================================
   REGISTER FORM
========================================= */

document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            const button =
                document
                    .getElementById(
                        "registerButton"
                    );


            /* -----------------------------
               VALIDATION
            ----------------------------- */


            if (!name) {

                showMessage(
                    "Please enter your name.",
                    "error"
                );

                return;

            }


            if (!email) {

                showMessage(
                    "Please enter your email.",
                    "error"
                );

                return;

            }


            if (password.length < 6) {

                showMessage(
                    "Password must contain at least 6 characters.",
                    "error"
                );

                return;

            }


            if (
                password !==
                confirmPassword
            ) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;

            }



            /* -----------------------------
               LOADING
            ----------------------------- */

            button.disabled = true;

            button.textContent =
                "Creating Account...";


            try {


                const response =
                    await fetch(
    "https://aegis-4lcw.onrender.com/register",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                name: name,

                                email: email,

                                password: password

                            })

                        }
                    );


                const data =
                    await response.json();



                /* -----------------------------
                   ERROR
                ----------------------------- */

                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "Registration failed."
                    );

                }



                /* -----------------------------
                   SUCCESS
                ----------------------------- */

                showMessage(
                    "Account created successfully! Redirecting to login...",
                    "success"
                );


                document
                    .getElementById(
                        "registerForm"
                    )
                    .reset();


                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    1500
                );


            } catch (error) {

                console.error(error);


                showMessage(
                    error.message ||
                    "Unable to connect to AEGIS backend.",
                    "error"
                );


            } finally {

                button.disabled = false;

                button.textContent =
                    "Create Account";

            }

        }
    );



/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;


    message.style.display =
        "block";


    message.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });

}

</script>


</body>

</html>
